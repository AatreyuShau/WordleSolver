<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="icon-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Wordle Solver</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #121213;
    color: #fafafa;
    font-family: "Figtree", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
}

h1 {
    margin-bottom: 25px;
}

.controls {
    scale: 0.75;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-bottom: 5px;
    margin-top: 5px;
}

.controls label {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.controls input,
.controls select,
.controls button {
    padding: 12px 16px;
    border: none;
    border-radius: 12px;

    background: #2c2c2e;
    color: white;

    font-size: 15px;
}

.controls select {
    cursor: pointer;
    height: 48px;
    transform: translateY(9px);
}

.controls button {
    cursor: pointer;
    transition: .2s;
}

.controls button:hover {
    background: #404045;
}

#grid {
    display: flex;
    justify-content: center;
    align-items: center;
}

table {
    border-collapse: separate;
    border-spacing: 8px;
}

.cell {
    width: 58px;
    height: 58px;

    border: 2px solid #3a3a3c;
    border-radius: 12px;

    background: #121213;
    color: white;

    text-align: center;

    font-size: 30px;
    font-weight: 700;

    text-transform: uppercase;

    outline: none;

    transition:
        transform .15s,
        background .25s,
        border-color .25s,
        box-shadow .25s;
}

.cell:hover {
    transform: scale(1.03);
}

.cell:focus {
    transform: scale(1.12);
    border-radius: 16px;

    border-color: #55d3a594;

    box-shadow:
        0 0 0 3px rgba(83,141,255,.35);
}

.cell:active {
    transform: scale(.95);
}

.gray {
    background: #3a3a3c;
    border-color: #3a3a3c;
}

.yellow {
    background: #dfc862;
    border-color: #dfc862;
}

.green {
    background: #86c379;
    border-color: #86c379;
}

#palette {
    position: fixed;
    right: 30px;
    top: 100px;

    display: none;
    flex-direction: column;
    gap: 8px;

    background: #202124;

    padding: 12px;

    border-radius: 14px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);
}

#palette button {
    border: none;
    border-radius: 8px;

    padding: 10px;

    background: #303134;

    color: white;

    cursor: pointer;
}

#palette button:hover {
    background: #444;
}

#results {
    width: min(800px,90vw);

    margin-top: 25px;

    padding: 20px;

    background: #1b1b1d;

    border: 1px solid #3a3a3c;
    border-radius: 14px;

    white-space: pre-wrap;

    max-height: 300px;
    overflow-y: auto;
}

#vk{
    position:fixed;
    left:0;
    right:0;
    bottom:-320px;
    background:#121213;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
    transition:bottom .35s ease;
    z-index:9999;
    box-shadow:0 -10px 30px rgba(0,0,0,.5);
}
#vk.open{
    bottom:0;
}
.vk-row{
    display:flex;
    gap:6px;
}
.vk-key,.vk-wide{
    border:none;
    border-radius:8px;
    background:#818384;
    color:white;
    font-weight:700;
    height:58px;
    cursor:pointer;
    transition:
    transform .15s,
    background .25s,
    box-shadow .25s;
}
.vk-key{
    width:43px;
}
.vk-wide{
    width:75px;
}
.vk-key:hover,.vk-wide:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}
.vk-key:active,.vk-wide:active{
    transform:scale(.93);
}
.vk-yellow{
    background:#dfc862!important;
}
.vk-green{
    background:#86c379!important;
}

body{
    cursor:url("cursors/cursor.svg") 8 8,auto;
}

body,
body *{
    cursor:none !important;
}

body.paint-gray,
body.paint-yellow,
body.paint-green{
    cursor:none;
}
body.paint-gray * ,
body.paint-yellow * ,
body.paint-green *{
    cursor:none!important;
}

#mouseCursor{
    position:fixed;
    width:32px;
    height:32px;
    pointer-events:none;
    z-index:999998;
    left:0;
    top:0;
    transform:translate(-2px,-2px);
}

#brushCursor{
    position:fixed;
    width:36px;
    height:36px;
    pointer-events:none;
    z-index:999999;
    left:0;
    top:0;
    opacity:0;
    transform:translate(-4px,-28px);
    transition:opacity .15s;
}
</style>

  <img src="logo.svg" rel="icon" type="image/png">
</head>

<body>
<div class="controls">
    <button id="keyboardButton">
        <img src="keys.svg" style="width: 36px; height: 36px; vertical-align: middle; margin-right: 0px;">
    </button>

    <label>
        Word Length
        <input id="w" type="number" value="5" min="1">
    </label>

    <label>
        Attempts
        <input id="h" type="number" value="6" min="1">
    </label>

    <button onclick="makeGrid()">
        Create Grid
    </button>

    <button onclick="analyze()">
        Analyze
    </button>

    <button id="brushButton">
      <img src="palette.svg" style="width: 36px; height: 36px; vertical-align: middle; margin-right: 0px;">
    </button>
    
    <select id="brushTheme">
        <option value="default">Default</option>
        <option value="splat">Splat</option>
        <option value="spot">Spot</option>
    </select>
</div>

<div id="palette">
    <button data-color="gray"><img src="grae.svg" style="width: 48px; height: 48px; vertical-align: middle;"></button>
    <button data-color="yellow"><img src="yelo.svg" style="width: 48px; height: 48px; vertical-align: middle;"></button>
    <button data-color="green"><img src="mido.svg" style="width: 48px; height: 48px; vertical-align: middle;"></button>
    <button data-color=""><img src="empty.svg" style="width: 48px; height: 48px; vertical-align: middle;"></button>
</div>

<div id="grid"></div>

<h3>Results</h3>
<div id="results">
[possible words]
</div>

<div id="vk">
<div class="vk-row">
<button class="vk-key">Q</button>
<button class="vk-key">W</button>
<button class="vk-key">E</button>
<button class="vk-key">R</button>
<button class="vk-key">T</button>
<button class="vk-key">Y</button>
<button class="vk-key">U</button>
<button class="vk-key">I</button>
<button class="vk-key">O</button>
<button class="vk-key">P</button>
</div>
<div class="vk-row">
<button class="vk-key">A</button>
<button class="vk-key">S</button>
<button class="vk-key">D</button>
<button class="vk-key">F</button>
<button class="vk-key">G</button>
<button class="vk-key">H</button>
<button class="vk-key">J</button>
<button class="vk-key">K</button>
<button class="vk-key">L</button>
</div>
<div class="vk-row">
<button class="vk-wide" data-key="Enter">ENTER</button>
<button class="vk-key">Z</button>
<button class="vk-key">X</button>
<button class="vk-key">C</button>
<button class="vk-key">V</button>
<button class="vk-key">B</button>
<button class="vk-key">N</button>
<button class="vk-key">M</button>
<button class="vk-wide" data-key="Backspace">⌫</button>
</div>
</div>

<img id="mouseCursor" src="cursors/cursor.svg">
<img id="brushCursor" src="brush.svg">

<script>
let grid = [],
    colors = [],
    selected = null,
    paintColor = null,
    painting = false;

const wInput = document.getElementById("w"),
      hInput = document.getElementById("h"),
      gridDiv = document.getElementById("grid"),
      results = document.getElementById("results"),
      palette = document.getElementById("palette"),
      brushTheme=document.getElementById("brushTheme"),
      brushButton = document.getElementById("brushButton"),
      keyboardButton=document.getElementById("keyboardButton"),
      vk=document.getElementById("vk");

function makeGrid() {
    const w = Number(wInput.value);
    const h = Number(hInput.value);

    grid = Array.from({length:h}, () => Array(w).fill(""));
    colors = Array.from({length:h}, () => Array(w).fill("gray"));

    let html = "<table>";

    for (let r = 0; r < h; r++) {
        html += "<tr>";

        for (let c = 0; c < w; c++) {
            html += `
            <td>
                <input
                    class="cell gray"
                    maxlength="1"
                    data-r="${r}"
                    data-c="${c}">
            </td>`;
        }

        html += "</tr>";
    }

    html += "</table>";
    gridDiv.innerHTML = html;

    document.querySelectorAll(".cell").forEach(cell => {
        cell.addEventListener("focus", () => selected = cell);
        cell.addEventListener("click", () => selected = cell);
        cell.addEventListener("mousedown", () => paint(cell));
        cell.addEventListener("mouseenter", () => {
            if (painting)
                paint(cell);
        });
    });

    document.querySelectorAll(".vk-key,.vk-wide").forEach(k=>{
        k.classList.remove("vk-yellow","vk-green");
        k.style.background="";
    });

    const first = document.querySelector(".cell");

    if (first)
        first.focus();
}

const brushCursor = document.getElementById("brushCursor");
const mouseCursor = document.getElementById("mouseCursor");

document.addEventListener("mousemove",e=>{
    mouseCursor.style.left=e.clientX + "px";
    mouseCursor.style.top=e.clientY + "px";
    brushCursor.style.left=(e.clientX-12)+"px";
    brushCursor.style.top=(e.clientY+18)+"px";
});

function updateBrushCursor(){
    if(paintColor){
        brushCursor.style.opacity="1";
        mouseCursor.style.opacity="0";
    }
    else{
        brushCursor.style.opacity="0";
        mouseCursor.style.opacity="1";
    }
}

function setCursor(type){
    if(paintColor){
        mouseCursor.style.opacity = "0";
        return;
    }

    mouseCursor.style.opacity = "1";
    if(type==="pointer"){
        mouseCursor.src="cursors/pointer.svg";
        mouseCursor.style.width="32px";
        mouseCursor.style.height="32px";
    }
    else if(type==="text"){
        mouseCursor.src="cursors/text.svg";
        mouseCursor.style.width="38px";
        mouseCursor.style.height="38px";
    }
    else if(type==="grab"){
        mouseCursor.src="cursors/grab.svg";
        mouseCursor.style.width="32px";
        mouseCursor.style.height="32px";
    }
    else{
        mouseCursor.src="cursors/cursor.svg";
        mouseCursor.style.transform="translate(-20px,-15px)";
        mouseCursor.style.width="48px";
        mouseCursor.style.height="48px";
    }
}

document.addEventListener("mouseover",e=>{
    if(paintColor)
        return;
    const t = e.target;

    if(
        t.matches(
            "button,select,.vk-key,.vk-wide"
        )
    ){
        setCursor("pointer");
    }
    else if(
        t.matches(
            "input,.cell"
        )
    ){
        setCursor("text");
    }
    else if(
        t.closest("#grid")
    ){
        setCursor("grab");
    }
    else{
        setCursor("default");
    }
});

function move(dr, dc) {
    if (!selected)
        return;

    const r = Number(selected.dataset.r) + dr;
    const c = Number(selected.dataset.c) + dc;

    const next = document.querySelector(
        `[data-r="${r}"][data-c="${c}"]`
    );

    if (next)
        next.focus();
}

document.addEventListener("keydown", e => {
    if (!selected)
        return;

    const r = Number(selected.dataset.r);
    const c = Number(selected.dataset.c);

    if (/^[a-zA-Z]$/.test(e.key)) {
        selected.value = e.key.toUpperCase();
        grid[r][c] = e.key.toLowerCase();

        move(0,1);
        e.preventDefault();
    }

    if (e.key === "ArrowLeft") {
        move(0,-1);
        e.preventDefault();
    }

    if (e.key === "ArrowRight") {
        move(0,1);
        e.preventDefault();
    }

    if (e.key === "ArrowUp") {
        move(-1,0);
        e.preventDefault();
    }

    if (e.key === "ArrowDown") {
        move(1,0);
        e.preventDefault();
    }

    if (
        e.key === "Backspace" ||
        e.key === "Delete"
    ) {
        if (grid[r][c]) {
            selected.value = "";
            grid[r][c] = "";
        }
        else if (c === 0 && r > 0) {
            const prevRow = r - 1;
            let target = 0;

            for (let i = grid[prevRow].length - 1; i >= 0; i--) {
                if (grid[prevRow][i]) {
                    target = i;
                    break;
                }
            }

            if (!grid[prevRow].some(x => x))
                target = grid[prevRow].length - 1;

            const next = document.querySelector(
                `[data-r="${prevRow}"][data-c="${target}"]`
            );

            if (next)
                next.focus();
        }
        else {
            move(0,-1);
        }

        e.preventDefault();
    }

    if (e.key === "Enter") {
        move(1,0);
        e.preventDefault();
    }
});

document.addEventListener(
    "mousedown",
    () => painting = true
);

document.addEventListener(
    "mouseup",
    () => painting = false
);

function paint(cell) {
    selected = cell;

    if (!paintColor)
        return;

    const r = Number(cell.dataset.r);
    const c = Number(cell.dataset.c);

    colors[r][c] = paintColor;

    cell.classList.remove(
        "gray",
        "yellow",
        "green"
    );

    cell.classList.add(paintColor);
}

brushButton.onclick = () => {
    palette.style.display =
        palette.style.display === "flex"
        ? "none"
        : "flex";
};

document.querySelectorAll("#palette button")
.forEach(button => {
    button.onclick = () => {
        paintColor =
            button.dataset.color || null;
        
        brushThemeValue=brushTheme.value;

        document.body.classList.remove(
            "paint-gray",
            "paint-yellow",
            "paint-green"
        );

        if (paintColor)
            document.body.classList.add(
                "paint-" + paintColor
            );
        
        if(paintColor==="gray")
            brushCursor.src=brushThemeValue+"/"+ "brush-grey.svg";

        if(paintColor==="yellow")
            brushCursor.src=brushThemeValue+"/"+ "brush-yellow.svg";

        if(paintColor==="green")
            brushCursor.src=brushThemeValue+"/"+ "brush-green.svg";

        updateBrushCursor();
    };
});

keyboardButton.onclick=()=>{
    vk.classList.toggle("open");
};

document.querySelectorAll(".vk-key,.vk-wide").forEach(key=>{
    key.onclick=()=>{
        const k=key.dataset.key||key.textContent;
        document.dispatchEvent(
            new KeyboardEvent("keydown",{
                key:k==="⌫"?"Backspace":k
            })
        );
    };
});

function analyze() {
    if (!grid.length)
        return;
    results.textContent = "Searching...";

    fetch(
        "https://wordle-solver-pink.vercel.app/solve",
        {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            },
            body: JSON.stringify({
                grid: grid,
                colors: colors
            })
        }
    )
    .then(r => r.json())
    .then(data => {
        results.textContent=
        `Found ${data.count} words:\n\n`
        +data.words.join(", ");

        document.querySelectorAll(".vk-key,.vk-wide").forEach(k=>{
            k.classList.remove("vk-yellow","vk-green");
        });

        for(let r=0;r<colors.length;r++){
            for(let c=0;c<colors[r].length;c++){
                let letter=grid[r][c];
                if(!letter) continue;

                const key=[...document.querySelectorAll(".vk-key")]
                .find(k=>k.textContent===letter.toUpperCase());

                if(!key) continue;

                if(colors[r][c]==="green"){
                    key.classList.remove("vk-yellow");
                    key.classList.add("vk-green");
                }
                else if(
                colors[r][c]==="yellow" &&
                !key.classList.contains("vk-green")
                ){
                    key.classList.add("vk-yellow");
                }
            }
        }
    })
    .catch(err => {
        console.error(err);
        results.textContent =
            "Backend not reachable.";
    });
}

makeGrid();
</script>

</body>
</html>
